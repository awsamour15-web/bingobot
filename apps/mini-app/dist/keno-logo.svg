<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <!-- Background gradient (dark teal) -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0a4a38"/>
      <stop offset="60%" stop-color="#052e22"/>
      <stop offset="100%" stop-color="#010f0a"/>
    </radialGradient>

    <!-- FAST text gradient: white top → silver → light green bottom -->
    <linearGradient id="fastGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="35%"  stop-color="#d8ece4"/>
      <stop offset="70%"  stop-color="#8abfa8"/>
      <stop offset="100%" stop-color="#5a9a7a"/>
    </linearGradient>

    <!-- KENO text gradient: bright green -->
    <linearGradient id="kenoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5de89a"/>
      <stop offset="40%"  stop-color="#3dba6a"/>
      <stop offset="100%" stop-color="#1a7a42"/>
    </linearGradient>

    <!-- Ball gradient: teal glassy -->
    <radialGradient id="ballGrad" cx="38%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#3dba80"/>
      <stop offset="45%"  stop-color="#0d6040"/>
      <stop offset="100%" stop-color="#032818"/>
    </radialGradient>

    <!-- Ball glow -->
    <filter id="ballGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Text shadow filter -->
    <filter id="textShadow" x="-5%" y="-5%" width="115%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.8)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="200" fill="url(#bgGrad)" rx="16"/>

  <!-- Subtle centre spotlight -->
  <ellipse cx="200" cy="85" rx="180" ry="70" fill="rgba(30,160,90,0.08)"/>

  <!-- ── FAST text ── -->
  <text
    x="12" y="108"
    font-family="'Arial Black','Impact','Franklin Gothic Heavy',sans-serif"
    font-size="88"
    font-weight="900"
    font-style="italic"
    fill="url(#fastGrad)"
    stroke="rgba(0,0,0,0.6)"
    stroke-width="4"
    paint-order="stroke fill"
    filter="url(#textShadow)"
    letter-spacing="-3"
  >FAST</text>

  <!-- ── KENO text (KEN + play icon) ── -->
  <text
    x="195" y="108"
    font-family="'Arial Black','Impact','Franklin Gothic Heavy',sans-serif"
    font-size="88"
    font-weight="900"
    font-style="italic"
    fill="url(#kenoGrad)"
    stroke="rgba(0,40,20,0.7)"
    stroke-width="3"
    paint-order="stroke fill"
    filter="url(#textShadow)"
    letter-spacing="-3"
  >KEN</text>

  <!-- Play button circle (replaces O) -->
  <circle cx="363" cy="68" r="32" fill="url(#kenoGrad)" stroke="rgba(0,40,20,0.6)" stroke-width="2.5" filter="url(#textShadow)"/>
  <!-- Triangle play icon -->
  <polygon points="352,53 352,83 380,68" fill="#0a3a20"/>

  <!-- ── Teal ball with 80 ── -->
  <circle cx="190" cy="165" r="28" fill="rgba(0,100,60,0.35)" filter="url(#ballGlow)"/>
  <circle cx="190" cy="158" r="26" fill="url(#ballGrad)" stroke="rgba(30,200,100,0.55)" stroke-width="2"/>
  <!-- Glass highlight on ball -->
  <ellipse cx="183" cy="146" rx="11" ry="5.5" fill="rgba(255,255,255,0.28)" transform="rotate(-20,183,146)"/>
  <!-- 80 label -->
  <text
    x="190" y="164"
    font-family="'Arial Black','Impact',sans-serif"
    font-size="18"
    font-weight="900"
    font-style="italic"
    fill="#d0ffe0"
    text-anchor="middle"
    dominant-baseline="middle"
    stroke="rgba(0,30,15,0.5)"
    stroke-width="1"
    paint-order="stroke fill"
  >80</text>
</svg>
