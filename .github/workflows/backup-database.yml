name: Database Backup

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create database backup
        env:
          # Must use the DIRECT (unpooled) connection — pg_dump doesn't work over pooled connections
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          BACKUP_FILE="fidelbingo_backup_${TIMESTAMP}.sql"
          echo "Creating backup: $BACKUP_FILE"
          pg_dump -Fc -v -d "$DIRECT_URL" -f "$BACKUP_FILE"
          echo "BACKUP_FILE=$BACKUP_FILE" >> $GITHUB_ENV

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v5
        with:
          name: db-backup-${{ github.run_number }}-${{ github.run_attempt }}
          path: "*.sql"
          retention-days: 90

      - name: Backup summary
        run: |
          SIZE=$(du -sh "$BACKUP_FILE" | cut -f1)
          echo "✓ Backup completed: $BACKUP_FILE ($SIZE)"
          echo "✓ Stored as GitHub Artifact for 90 days"
          echo "✓ View at: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
