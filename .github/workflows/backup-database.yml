name: Database Backup

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create database backup
        env:
          BACKUP_URL: ${{ secrets.BACKUP_URL }}
        run: |
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          BACKUP_FILE="fidelbingo_backup_${TIMESTAMP}.json"
          echo "Creating backup: $BACKUP_FILE"
          curl -f -H "Authorization: Bearer ${{ secrets.ADMIN_JWT }}" \
            "$BACKUP_URL/api/admin/backup" -o "$BACKUP_FILE"
          echo "BACKUP_FILE=$BACKUP_FILE" >> $GITHUB_ENV

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v5
        with:
          name: db-backup-${{ github.run_number }}-${{ github.run_attempt }}
          path: "*.json"
          retention-days: 90

      - name: Backup summary
        run: |
          SIZE=$(du -sh "$BACKUP_FILE" | cut -f1)
          echo "✓ Backup completed: $BACKUP_FILE ($SIZE)"
          echo "✓ Stored as GitHub Artifact for 90 days"
          echo "✓ View at: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
