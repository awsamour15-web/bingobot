[phases.setup]
nixPkgs = ["nodejs_22", "nodePackages.pnpm", "openssl"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm --filter @fidel/shared build",
  "pnpm --filter @fidel/backend exec prisma generate",
  "pnpm --filter @fidel/backend exec tsc"
]

[start]
cmd = "cd apps/backend && npx prisma migrate deploy && node dist/index.js"
