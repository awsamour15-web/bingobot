[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]
cmds = ["corepack enable", "corepack prepare pnpm@9.0.0 --activate"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
    "pnpm --filter @fidel/backend exec prisma generate",
    "pnpm --filter @fidel/backend build"
]

[start]
cmd = "cd apps/backend && npx prisma migrate deploy && node dist/index.js"
